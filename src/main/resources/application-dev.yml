spring:
  config:
    import: optional:file:docker/.env[.properties]
  web:
    error:
      include-binding-errors: always

cors:
  allowed-origin-patterns:
    - "http://localhost:*"
    # Sandboxed iframes and file:// pages, e.g. a locally opened HTML client
    - "null"

kostack-security:
  query-parameter:
    enabled: true
