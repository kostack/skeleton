app:
  value: staging
jwt:
  issuer: staging
  expiration: 300000
  public_keys:
    staging: ${JWT_PUBLIC_KEY}
spring:
  web:
    error:
      include-binding-errors: always

logging:
  level:
    io.kostack: INFO
    org:
      springframework:
        security: INFO
        data:
          mongodb: INFO
