cors:
  path-pattern: "/**"
  allowed-origin-patterns:
    - "http://localhost:*"
    - "null"
  allowed-methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
    - HEAD
  allowed-headers:
    - "*"
  allow-credentials: false
server:
  port: ${SERVER_PORT:8080}
spring:
  profiles:
    default: dev
  application:
    name: skeleton-service
  webflux:
    apiversion:
      default: 1
      supported: 1,2
  shell:
    interactive:
      enabled: false
  mongodb:
    uri: ${MONGO_URI}
  r2dbc:
    url: r2dbc:${MYSQL_URL}/${MYSQL_DB}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    properties:
      schema: ${MYSQL_DB}
    pool:
      enabled: true
      max-size: 20
      initial-size: 10
      max-idle-time: 30m
  # Flyway (JDBC) configuration
  flyway:
    enabled: true
    url: jdbc:${MYSQL_URL}/${MYSQL_DB}
    user: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  datasource:
    url: jdbc:${MYSQL_URL}/${MYSQL_DB}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASS}
    port: ${RABBITMQ_PORT}
  cloud:
    stream:
      function:
        autodetect: false
      bindings:
        supplier-out-0:
          destination: demo.queue

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        alb:
          include:
            - livenessState
            - readinessState

logging:
  level:
    io.kostack: INFO
    org.flywaydb: INFO
    org:
      springframework:
        boot.autoconfigure.flyway: INFO
        security: INFO
        data:
          mongodb: INFO


web-security:
  basic-auth-user: ${BASIC_AUTH_USER}
  basic-auth-password: ${BASIC_AUTH_PASSWORD}
  probe-header: ${PROBE_HEADER}
  probe-value: ${PROBE_VALUE}

kostack-security:
  issuer:
    kid: local
    audience: kostack
    private-key: ${JWT_PRIVATE_KEY}
    algorithm-signature: RS512
    expiration-time: 3600
  trusted-issuers:
    local:
      issuer: local
      audience: kostack
      algorithm: RS512
      public-key: ${JWT_PUBLIC_KEY}
    user-service:
      issuer: user-service.local
      audience: kostack
      algorithm: RS512
      jwk-set-uri: http://user-service.local/.well-known/jwks.json
  authorization-header:
    enabled: true
  query-parameter:
    enabled: true
    name: token

springdoc:
  api-docs:
    enabled: true

scalar:
  enabled: true
  path: "/docs"
  url: "/v3/api-docs"
  page-title: "API Documentation"
  telemetry: false
