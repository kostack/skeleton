spring:
  application:
    name: skeleton-service
  config:
    import: optional:file:docker/.env[.properties]
  webflux:
    apiversion:
      default: 1
      supported: 1,2
  shell:
    interactive:
      enabled: false
  mongodb:
    uri: ${MONGO_URI}
  r2dbc:
    url: r2dbc:${MYSQL_URL}/${MYSQL_DB}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    properties:
      schema: ${MYSQL_DB}
    pool:
      enabled: true
      initial-size: 2
      max-size: 20
      max-idle-time: 30m
      # Recycle connections well before MySQL's wait_timeout closes them
      max-life-time: 1h
      # Fail fast instead of waiting indefinitely when the pool is exhausted
      max-acquire-time: 5s
      validation-query: SELECT 1
  # Flyway runs over JDBC with its own connection settings; the application itself uses R2DBC only
  flyway:
    enabled: true
    url: jdbc:${MYSQL_URL}/${MYSQL_DB}
    user: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASS}
    port: ${RABBITMQ_PORT}
  cloud:
    stream:
      function:
        autodetect: false
      bindings:
        demo-out:
          destination: demo.queue

cors:
  path-pattern: "/**"
  # Comma-separated origin patterns
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:}
  allowed-methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
    - HEAD
  allowed-headers:
    - "*"
  allow-credentials: false

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      # Readiness includes the backing services: when one is down, pods stop receiving traffic
      # (all pods at once for a shared outage) and recover automatically when it returns.
      # Liveness deliberately excludes them, so an outage never triggers restarts.
      group:
        readiness:
          include:
            - readinessState
            - r2dbc
            - mongo
            - rabbit
        alb:
          include:
            - livenessState
            - readinessState
            - r2dbc
            - mongo
            - rabbit


web-security:
  basic-auth-user: ${BASIC_AUTH_USER}
  basic-auth-password: ${BASIC_AUTH_PASSWORD}

kostack-security:
  issuer:
    kid: local
    audience: kostack
    private-key: ${JWT_PRIVATE_KEY}
    algorithm-signature: RS512
    expiration-time: 3600
  trusted-issuers:
    local:
      issuer: local
      audience: kostack
      algorithm: RS512
      public-key: ${JWT_PUBLIC_KEY}
    user-service:
      issuer: user-service.local
      audience: kostack
      algorithm: RS512
      jwk-set-uri: ${USER_SERVICE_JWKS_URI:http://user-service.local/.well-known/jwks.json}
  authorization-header:
    enabled: true
  query-parameter:
    enabled: false
    name: token

springdoc:
  api-docs:
    enabled: true

scalar:
  enabled: true
  path: "/docs"
  url: "/v3/api-docs"
  page-title: "API Documentation"
  telemetry: false
