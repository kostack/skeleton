# JVM options for the Gradle daemon. These replace Gradle's defaults, which are kept here.
# The Java 24+ flags silence warnings from Gradle's native library loading and from IntelliJ's
# kryo library (injected into the daemon) using sun.misc.Unsafe.
# Keep credentials out of this file; put them in ~/.gradle/gradle.properties instead.
org.gradle.jvmargs=-Xms256m -Xmx512m -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError \
  --enable-native-access=ALL-UNNAMED --sun-misc-unsafe-memory-access=allow

# Resolve io.github.kostack artifacts from mavenLocal first (local development of kostack libraries)
kostack.useMavenLocal=true
